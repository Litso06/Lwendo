<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lwendo</title>
    <link rel="stylesheet" href="/style/payment.css">
</head>
<body>
    <header>
        <div class="logo">
            <img src="/images/Lwedo logo.png" alt="Lwendo Logo">
        </div>

    <ul class="nav-links">
      <li><a href="index.html">Home</a> </li>
      <li><a href="#about">About</a> </li>
      <li><a href="#contact">Contact</a></li>
    </ul>

    <button class="account-button">
      <a href="">Account</a>
    </button>
    </header>

    <div class="container">
    <h2>Payment Method</h2>

    <form>
      <label class="option">
        <input type="radio" name="payment" value="visa" />
        <span>VISA</span>
      </label>

      <div class="mobile-money">
        <label class="option">
          <input type="radio" name="payment" value="airtel" />
          <span>Airtel Money</span>
        </label>
        <label class="option">
          <input type="radio" name="payment" value="mtn" />
          <span>MTN MoMo</span>
        </label>
        <label class="option">
          <input type="radio" name="payment" value="zamtel" />
          <span>Zamtel Kwacha</span>
        </label>
      </div>

      <button class="continue-button">
        <a href="">Continue</a>
      </button>
      
    </form>
  </div>

</body>
</html>
