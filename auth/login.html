<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lwendo</title>
    <link rel="stylesheet" href="style/auth.css">
</head>
<body>
    <header>
        <div class="logo">
            <img src="images/Lwedo logo.png" alt="Lwendo Logo">
        </div>

    <button class="signup-button">
      <a href="auth/signup.html">Sign Up</a>
    </button>
    </header>

  <div class="container">
  <div class="heading">Login</div>
  <div class="subheading">Hey! Good to see you again. Sign In to continue</div>

  <form class="form" action="index.html">
  <input
    placeholder="E-mail"
    id="email"
    name="email"
    type="email"
    class="input"
    required
  />
  <input
    placeholder="Password"
    id="password"
    name="password"
    type="password"
    class="input"
    required
  />
  <span class="forgot-password"><a href="#">Forgot Password?</a></span>
  <input value="Sign In" type="submit" class="login-button" />
</form> 
    <span class="agreement"><a href="#">Learn user licence agreement</a></span>
    </div>
  </div>
  
</div>

</body>
<footer> 
    <div class="footer-container">
    <!-- Bottom Bar -->
    <div class="footer-bottom">
      <p>© 2025 Lwendo. All Rights Reserved. | <a href="#">Terms of Service</a> | <a href="#">Privacy Policy</a></p>
    </div>
</footer>
</html>
