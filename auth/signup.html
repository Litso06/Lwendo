<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lwendo</title>
    <link rel="stylesheet" href="style/auth.css">
</head>
<body>
    <header>
        <div class="logo">
            <img src="images/Lwedo logo.png" alt="Lwendo Logo">
        </div>

    <button class="login-button">
      <a href="auth/login.html">Login</a>
    </button>
    </header>

    <!-- Content -->
<div class="container">
  <div class="heading">Create Acount</div>
  <div class="subheading">Thankyou for choosing Lwedo. Signup to get started</div>

  <form class="form" action="index.html">
  <input
    placeholder="Full Name"
    id="fullname"
    name="fullname"
    type="fullname"
    class="input"
    required
  />
  <input
    placeholder="Email"
    id="email"
    name="email"
    type="email"
    class="input"
    required
  />
  <input
    placeholder="dd / mm / yyyy"
    id="dob"
    name="dob"
    type="dob"
    class="input"
    required
  />
    <input
    placeholder="Address"
    id="address"
    name="address"
    type="address"
    class="input"
    required
  />
    <input
    placeholder="Phone Number"
    id="phone"
    name="phone"
    type="phone"
    class="input"
    required
  />
    <input
    placeholder="Gender"
    id="gender"
    name="gender"
    type="gender"
    class="input"
    required
  />
    <input
    placeholder="Password"
    id="password"
    name="password"
    type="password"
    class="input"
    required
  />
    <input
    placeholder="Confirm Password"
    id="confirm-password"
    name="confirm-password"
    type="confirm-password"
    class="input"
    required
  />

  <span class="forgot-password"><a href="#">Forgot Password?</a></span>
  <input value="Sign Up" type="submit" class="login-button" />
</form> 
</body>
<footer>
    <div class="footer-container">
    <!-- Bottom Bar -->
    <div class="footer-bottom">
      <p>© 2025 Lwendo. All Rights Reserved. | <a href="#">Terms of Service</a> | <a href="#">Privacy Policy</a></p>
    </div>
</footer>
</html>
